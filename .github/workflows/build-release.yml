name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Android 签名 APK。历史上这是工作流里唯一的 job，所以叫 `build`；现在四个平台 job
  # 按平台命名（build-android / build-macos / build-linux / build-windows），它跟着对齐。
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 强制 tag 版本与代码 versionName 一致：APK 名由 versionName 生成（orilumn-<version>.apk），
      # 若打 tag 时代码已提前提升到下个版本（如 tag v0.3.5 时 versionName 已是 0.3.6），
      # 会发布出与 Release 版本不符的 APK。这里不一致直接失败，强制先对齐再发版。
      - name: Verify tag matches versionName
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_VER="${GITHUB_REF_NAME#v}"
          CODE_VER=$(sed -n 's/^orilumn.versionName=//p' gradle.properties | head -1 | tr -d '[:space:]"')
          if [ "$TAG_VER" != "$CODE_VER" ]; then
            echo "::error::Tag v${TAG_VER} 与 gradle.properties 的 orilumn.versionName \"${CODE_VER}\" 不一致。"
            echo "::error::请先把 tagged 提交的 versionName 改为 \"${TAG_VER}\"（versionCode 同步递增）后再打/重打 tag。"
            exit 1
          fi
          echo "OK: tag v${TAG_VER} matches versionName \"${CODE_VER}\""
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant gradlew execute permission
        run: chmod +x gradlew

      # 运行时从 Secrets 读出 base64 字符串，在云端内存中解码还原出临时 jks（不透写仓库，跑完即销毁）。
      - name: Materialize keystore from secret
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/keystore.jks"
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}

      - name: Build signed release APK
        run: ./gradlew :app:assembleRelease --no-daemon
        env:
          # 4 个机密在 GitHub 后台保存，不会出现在代码仓库，也不会被 git 提交。
          KEYSTORE_FILE: ${{ runner.temp }}/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      # Gradle 产出的 APK 文件名固定带构建类型后缀（orilumn-<ver>-release.apk）。
      # 按 versionName 重命名为平台口径 orilumn-<ver>-android.apk，与 DMG/DEB/RPM/AppImage/MSI 的
      # Orilumn-<ver>-<平台>.<ext> 对齐（Release 列表里一眼看出这是 Android 包）。
      - name: Rename APK with version
        run: |
          VER=$(sed -n 's/^orilumn.versionName=//p' gradle.properties | head -1 | tr -d '[:space:]"')
          # 版本号取空时直接失败：否则会产出 orilumn--android.apk 这种坏文件名并随 Release 发布。
          if [ -z "$VER" ]; then
            echo "::error::无法从 gradle.properties 读到 orilumn.versionName，拒绝重命名。"
            exit 1
          fi
          ls app/build/outputs/apk/release/
          for f in app/build/outputs/apk/release/orilumn-*.apk; do
            mv "$f" "app/build/outputs/apk/release/orilumn-${VER}-android.apk"
          done
          ls app/build/outputs/apk/release/

      - name: Upload APK as workflow artifact (all runs)
        uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: app/build/outputs/apk/release/orilumn-*-android.apk
          if-no-files-found: error

  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            arch: arm64
          - os: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant gradlew execute permission
        run: chmod +x gradlew

      - name: Build DMG (unsigned)
        run: ./gradlew :desktopApp:packageDmg --no-daemon

      # DMG 文件名里的 jpackage 版本（macOS 强制 MAJOR>0，如 2.0）与发版版本（0.2.0）不一致：
      # 按 app versionName + 架构重命名后再上传（如 Orilumn-0.2.0-macos-arm64.dmg）。
      - name: Rename DMG with version and arch
        run: |
          VER=$(sed -n 's/^orilumn.versionName=//p' gradle.properties | head -1 | tr -d '[:space:]"')
          # 版本号取空时直接失败：否则会产出 Orilumn--macos-<arch>.dmg 这种坏文件名并随 Release 发布
          # （v0.3.0 就这么多出过两个无版本号 DMG）。
          if [ -z "$VER" ]; then
            echo "::error::无法从 gradle.properties 读到 orilumn.versionName，拒绝重命名。"
            exit 1
          fi
          ls desktopApp/build/compose/binaries/main/dmg/
          for f in desktopApp/build/compose/binaries/main/dmg/*.dmg; do
            mv "$f" "desktopApp/build/compose/binaries/main/dmg/Orilumn-${VER}-macos-${{ matrix.arch }}.dmg"
          done
          ls desktopApp/build/compose/binaries/main/dmg/

      - name: Upload DMG as workflow artifact (all runs)
        uses: actions/upload-artifact@v4
        with:
          name: dmg-macos-${{ matrix.arch }}
          path: desktopApp/build/compose/binaries/main/dmg/*.dmg
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant gradlew execute permission
        run: chmod +x gradlew

      # jpackage 打 deb 依赖 fakeroot/dpkg（ubuntu-latest 已预装），打 rpm 依赖 rpmbuild
      # ——由 Ubuntu 的 rpm 包提供，镜像不带，必须先装；缺它时 jpackage 直接报错。
      - name: Install RPM build tooling
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rpm

      - name: Build DEB and RPM
        run: ./gradlew :desktopApp:packageDeb :desktopApp:packageRpm --no-daemon

      # 两个安装包的文件名里 jpackage 版本与发版版本（versionName）不同，
      # 按 app versionName 重命名后再上传（与 DMG 同口径）。
      - name: Rename DEB and RPM with version
        run: |
          VER=$(sed -n 's/^orilumn.versionName=//p' gradle.properties | head -1 | tr -d '[:space:]"')
          # 版本号取空时直接失败：否则会产出 Orilumn--linux-x64.deb 这种坏文件名并随 Release 发布。
          if [ -z "$VER" ]; then
            echo "::error::无法从 gradle.properties 读到 orilumn.versionName，拒绝重命名。"
            exit 1
          fi
          ls desktopApp/build/compose/binaries/main/deb/
          for f in desktopApp/build/compose/binaries/main/deb/*.deb; do
            mv "$f" "desktopApp/build/compose/binaries/main/deb/Orilumn-${VER}-linux-x64.deb"
          done
          ls desktopApp/build/compose/binaries/main/deb/
          ls desktopApp/build/compose/binaries/main/rpm/
          for f in desktopApp/build/compose/binaries/main/rpm/*.rpm; do
            mv "$f" "desktopApp/build/compose/binaries/main/rpm/Orilumn-${VER}-linux-x64.rpm"
          done
          ls desktopApp/build/compose/binaries/main/rpm/

      # Compose 的 AppImage 目标只是 jpackage --type app-image 的便携目录（不是单文件），
      # 先用 createDistributable 拿到它，再交给 make-appimage.sh 配 appimagetool 打成 .AppImage。
      - name: Build portable app-image (for AppImage)
        run: ./gradlew :desktopApp:createDistributable --no-daemon

      # 锁版本而非 continuous：出包工具是外部依赖，同一 tag 必须能复现同一产物。
      # 无 FUSE 也能跑（APPIMAGE_EXTRACT_AND_RUN=1 自解包执行），故不需要装 libfuse2。
      - name: Fetch appimagetool
        run: |
          curl -fsSLo "$RUNNER_TEMP/appimagetool" \
            "https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage"
          chmod +x "$RUNNER_TEMP/appimagetool"
          # 提前验证它真能跑（下个步骤就靠它），失败立刻停这里而不是等到出包。
          APPIMAGE_EXTRACT_AND_RUN=1 "$RUNNER_TEMP/appimagetool" --version

      - name: Build AppImage
        run: |
          VER=$(sed -n 's/^orilumn.versionName=//p' gradle.properties | head -1 | tr -d '[:space:]"')
          if [ -z "$VER" ]; then
            echo "::error::无法从 gradle.properties 读到 orilumn.versionName，拒绝命名 AppImage。"
            exit 1
          fi
          # VERSION 由 appimagetool 写进 AppDir 的 desktop 文件（X-AppImage-Version），
          # 供桌面集成/AppImageLauncher 显示版本；有显式输出名，故不影响产物文件名。
          VERSION="$VER" sh desktopApp/make-appimage.sh \
            desktopApp/build/compose/binaries/main/app \
            desktopApp/src/main/resources/icon.png \
            "desktopApp/build/compose/binaries/main/appimage/Orilumn-${VER}-linux-x64.AppImage" \
            "$RUNNER_TEMP/appimagetool"

      - name: Upload DEB as workflow artifact (all runs)
        uses: actions/upload-artifact@v4
        with:
          name: deb-linux-x64
          path: desktopApp/build/compose/binaries/main/deb/*.deb
          if-no-files-found: error

      - name: Upload RPM as workflow artifact (all runs)
        uses: actions/upload-artifact@v4
        with:
          name: rpm-linux-x64
          path: desktopApp/build/compose/binaries/main/rpm/*.rpm
          if-no-files-found: error

      - name: Upload AppImage as workflow artifact (all runs)
        uses: actions/upload-artifact@v4
        with:
          name: appimage-linux-x64
          path: desktopApp/build/compose/binaries/main/appimage/*.AppImage
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    # Windows runner 默认 pwsh；下面的 sed/循环用 bash（Git Bash），故显式指定。
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant gradlew execute permission
        run: chmod +x gradlew

      # jpackage 打 msi 依赖 WiX Toolset；windows-latest 已预装（WiX 3.14），无需 choco。
      - name: Build MSI
        run: ./gradlew :desktopApp:packageMsi --no-daemon

      - name: Rename MSI with version
        run: |
          VER=$(sed -n 's/^orilumn.versionName=//p' gradle.properties | head -1 | tr -d '[:space:]"')
          if [ -z "$VER" ]; then
            echo "::error::无法从 gradle.properties 读到 orilumn.versionName，拒绝重命名。"
            exit 1
          fi
          ls desktopApp/build/compose/binaries/main/msi/
          for f in desktopApp/build/compose/binaries/main/msi/*.msi; do
            mv "$f" "desktopApp/build/compose/binaries/main/msi/Orilumn-${VER}-windows-x64.msi"
          done
          ls desktopApp/build/compose/binaries/main/msi/

      - name: Upload MSI as workflow artifact (all runs)
        uses: actions/upload-artifact@v4
        with:
          name: msi-windows-x64
          path: desktopApp/build/compose/binaries/main/msi/*.msi
          if-no-files-found: error

  # Release 附件收口到这一个 job —— 全流程里**唯一一次创建 Release**。
  #
  # 注意：Windows MSI 与 macOS DMG 至今未签名（SmartScreen 拦一次 / Gatekeeper 需右键打开），
  # 自用分发可接受；要公开发行再立项做代码签名与公证。
  #
  # 以前是四个构建 job 各自 softprops「没有就建、有就追加」：「先查后建」不是原子操作，
  # 两个 job 同时查到「还没有」就同时去建，后者必得 422 already_exists —— v0.4.3 的签名 APK
  # 就这么丢过（构建成功、artifact 上传成功，只有「挂到 Release」那步红）。创建只有一处后，
  # 竞态在结构上消失，不再靠时序运气。
  # 顺带修掉：Release 说明（body）原先只由 APK job 写，它一失败 body 就是 null。
  release:
    # 只在打 tag 时出 Release（workflow_dispatch 干跑不建 Release，与原行为一致）；
    # needs + !cancelled()：某个平台构建失败也照样发布其余已成功的产物，而不是整个 Release 缺席。
    if: ${{ startsWith(github.ref, 'refs/tags/') && !cancelled() }}
    needs: [build-android, build-macos, build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      # 四个构建 job 都已把成品作为 artifact 上传（全场景上传，不限 tag），这里一次性合并下载。
      # 每个 artifact 内就是那个改好名的成品文件，merge-multiple 后平铺在 dist/ 下。
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Attach all packages to Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          # 附件全部取自合并下载的 artifact（dist/），不再回头读各 job 的构建产物目录。
          files: dist/**
          body: |
            自动构建的产物（GitHub Actions 云端编译）。

            - Android（已签名）：`orilumn-<版本>-android.apk`
            - Windows：`Orilumn-<版本>-windows-x64.msi`（未签名，SmartScreen 会拦一次：更多信息 → 仍要运行）
            - macOS：`Orilumn-<版本>-macos-arm64.dmg` / `-macos-x64.dmg`（未签名，首次打开需右键 → 打开）
            - Linux：`Orilumn-<版本>-linux-x64.deb` / `.rpm` / `.AppImage`