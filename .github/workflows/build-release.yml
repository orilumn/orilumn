name: Build signed release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 强制 tag 版本与代码 versionName 一致：APK 名由 versionName 生成（orilumn-<version>.apk），
      # 若打 tag 时代码已提前提升到下个版本（如 tag v0.3.5 时 versionName 已是 0.3.6），
      # 会发布出与 Release 版本不符的 APK。这里不一致直接失败，强制先对齐再发版。
      - name: Verify tag matches versionName
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_VER="${GITHUB_REF_NAME#v}"
          CODE_VER=$(sed -n 's/^orilumn.versionName=//p' gradle.properties | head -1 | tr -d '[:space:]"')
          if [ "$TAG_VER" != "$CODE_VER" ]; then
            echo "::error::Tag v${TAG_VER} 与 gradle.properties 的 orilumn.versionName \"${CODE_VER}\" 不一致。"
            echo "::error::请先把 tagged 提交的 versionName 改为 \"${TAG_VER}\"（versionCode 同步递增）后再打/重打 tag。"
            exit 1
          fi
          echo "OK: tag v${TAG_VER} matches versionName \"${CODE_VER}\""
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant gradlew execute permission
        run: chmod +x gradlew

      # 运行时从 Secrets 读出 base64 字符串，在云端内存中解码还原出临时 jks（不透写仓库，跑完即销毁）。
      - name: Materialize keystore from secret
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/keystore.jks"
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}

      - name: Build signed release APK
        run: ./gradlew :app:assembleRelease --no-daemon
        env:
          # 4 个机密在 GitHub 后台保存，不会出现在代码仓库，也不会被 git 提交。
          KEYSTORE_FILE: ${{ runner.temp }}/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      # Gradle 产出的 APK 文件名固定带构建类型后缀（orilumn-<ver>-release.apk）。
      # 按 versionName 重命名为平台口径 orilumn-<ver>-android.apk，与 DMG/DEB/MSI 的
      # Orilumn-<ver>-<平台>.<ext> 对齐（Release 列表里一眼看出这是 Android 包）。
      - name: Rename APK with version
        run: |
          VER=$(sed -n 's/^orilumn.versionName=//p' gradle.properties | head -1 | tr -d '[:space:]"')
          # 版本号取空时直接失败：否则会产出 orilumn--android.apk 这种坏文件名并随 Release 发布。
          if [ -z "$VER" ]; then
            echo "::error::无法从 gradle.properties 读到 orilumn.versionName，拒绝重命名。"
            exit 1
          fi
          ls app/build/outputs/apk/release/
          for f in app/build/outputs/apk/release/orilumn-*.apk; do
            mv "$f" "app/build/outputs/apk/release/orilumn-${VER}-android.apk"
          done
          ls app/build/outputs/apk/release/

      - name: Upload APK as workflow artifact (all runs)
        uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: app/build/outputs/apk/release/orilumn-*-android.apk
          if-no-files-found: error

      # 仅打 tag 时把签名 APK 挂到对应 GitHub Release。
      - name: Attach signed APK to Release
        if: startsWith(github.ref, 'refs/tags/') && success()
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body: 自动构建的签名 APK（由 GitHub Actions 云端编译、tested/签名后发布）。
          files: app/build/outputs/apk/release/orilumn-*-android.apk

  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            arch: arm64
          - os: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant gradlew execute permission
        run: chmod +x gradlew

      - name: Build DMG (unsigned)
        run: ./gradlew :desktopApp:packageDmg --no-daemon

      # DMG 文件名里的 jpackage 版本（macOS 强制 MAJOR>0，如 2.0）与发版版本（0.2.0）不一致：
      # 按 app versionName + 架构重命名后再上传（如 Orilumn-0.2.0-macos-arm64.dmg）。
      - name: Rename DMG with version and arch
        run: |
          VER=$(sed -n 's/^orilumn.versionName=//p' gradle.properties | head -1 | tr -d '[:space:]"')
          # 版本号取空时直接失败：否则会产出 Orilumn--macos-<arch>.dmg 这种坏文件名并随 Release 发布
          # （v0.3.0 就这么多出过两个无版本号 DMG）。
          if [ -z "$VER" ]; then
            echo "::error::无法从 gradle.properties 读到 orilumn.versionName，拒绝重命名。"
            exit 1
          fi
          ls desktopApp/build/compose/binaries/main/dmg/
          for f in desktopApp/build/compose/binaries/main/dmg/*.dmg; do
            mv "$f" "desktopApp/build/compose/binaries/main/dmg/Orilumn-${VER}-macos-${{ matrix.arch }}.dmg"
          done
          ls desktopApp/build/compose/binaries/main/dmg/

      - name: Upload DMG as workflow artifact (all runs)
        uses: actions/upload-artifact@v4
        with:
          name: dmg-macos-${{ matrix.arch }}
          path: desktopApp/build/compose/binaries/main/dmg/*.dmg
          if-no-files-found: error

      # 仅打 tag 时把 DMG 挂到对应 GitHub Release（与 APK 同一 Release 下追加文件）。
      # 未签名：下载后首次打开需右键→打开过 Gatekeeper，自用分发可接受；要公开发行再立项做签名公证。
      - name: Attach DMG to Release
        if: startsWith(github.ref, 'refs/tags/') && success()
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: desktopApp/build/compose/binaries/main/dmg/*.dmg

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant gradlew execute permission
        run: chmod +x gradlew

      # jpackage 打 deb 依赖 fakeroot/dpkg；ubuntu-latest 已预装（fakeroot 1.28），无需 apt-get。
      - name: Build DEB
        run: ./gradlew :desktopApp:packageDeb --no-daemon

      # deb 文件名带 jpackage 版本，按 app versionName + 架构重命名后再上传（与 DMG 同口径）。
      - name: Rename DEB with version
        run: |
          VER=$(sed -n 's/^orilumn.versionName=//p' gradle.properties | head -1 | tr -d '[:space:]"')
          # 版本号取空时直接失败：否则会产出 Orilumn--linux-x64.deb 这种坏文件名并随 Release 发布。
          if [ -z "$VER" ]; then
            echo "::error::无法从 gradle.properties 读到 orilumn.versionName，拒绝重命名。"
            exit 1
          fi
          ls desktopApp/build/compose/binaries/main/deb/
          for f in desktopApp/build/compose/binaries/main/deb/*.deb; do
            mv "$f" "desktopApp/build/compose/binaries/main/deb/Orilumn-${VER}-linux-x64.deb"
          done
          ls desktopApp/build/compose/binaries/main/deb/

      - name: Upload DEB as workflow artifact (all runs)
        uses: actions/upload-artifact@v4
        with:
          name: deb-linux-x64
          path: desktopApp/build/compose/binaries/main/deb/*.deb
          if-no-files-found: error

      # 仅打 tag 时把 deb 挂到对应 GitHub Release（与 APK/DMG 同一 Release 下追加文件）。
      - name: Attach DEB to Release
        if: startsWith(github.ref, 'refs/tags/') && success()
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: desktopApp/build/compose/binaries/main/deb/*.deb

  build-windows:
    runs-on: windows-latest
    # Windows runner 默认 pwsh；下面的 sed/循环用 bash（Git Bash），故显式指定。
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant gradlew execute permission
        run: chmod +x gradlew

      # jpackage 打 msi 依赖 WiX Toolset；windows-latest 已预装（WiX 3.14），无需 choco。
      - name: Build MSI
        run: ./gradlew :desktopApp:packageMsi --no-daemon

      - name: Rename MSI with version
        run: |
          VER=$(sed -n 's/^orilumn.versionName=//p' gradle.properties | head -1 | tr -d '[:space:]"')
          if [ -z "$VER" ]; then
            echo "::error::无法从 gradle.properties 读到 orilumn.versionName，拒绝重命名。"
            exit 1
          fi
          ls desktopApp/build/compose/binaries/main/msi/
          for f in desktopApp/build/compose/binaries/main/msi/*.msi; do
            mv "$f" "desktopApp/build/compose/binaries/main/msi/Orilumn-${VER}-windows-x64.msi"
          done
          ls desktopApp/build/compose/binaries/main/msi/

      - name: Upload MSI as workflow artifact (all runs)
        uses: actions/upload-artifact@v4
        with:
          name: msi-windows-x64
          path: desktopApp/build/compose/binaries/main/msi/*.msi
          if-no-files-found: error

      # 未签名：SmartScreen 会拦一次（更多信息→仍要运行），自用分发可接受；要公开发行再立项做签名。
      - name: Attach MSI to Release
        if: startsWith(github.ref, 'refs/tags/') && success()
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: desktopApp/build/compose/binaries/main/msi/*.msi