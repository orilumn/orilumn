# Gradle 守护进程 JVM 参数与编码
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true
android.suppressUnsupportedCompileSdk=36

kotlin.code.style=official

# KMP 默认层级模板：显式关掉。
#
# 本仓库三个 KMP 模块（common / engine-skia / shared-ui）都只有 android + jvm 两个目标，
# 默认模板不为这对目标造任何中间源集（它只分组 native/js/wasm 那些），关掉 = 零行为变化。
# 而 `:common` 必须保留 `jvmLikeMain` 这条显式 dependsOn 边（JVM 系 actual 一套同时喂
# android 与 jvm；老写法 `androidMain.dependsOn(jvmMain)` 违反「任何源集都不得依赖编译
# 默认源集」）。只要存在显式 dependsOn 边，模板就整体拒绝应用并每次构建刷
# 「Default Kotlin Hierarchy Template Not Applied Correctly」。模板本来就一直没被应用
# （构建一直就是这么跑的），这句只是把「不应用」写成明确意图、消掉警告。
kotlin.mpp.applyDefaultHierarchyTemplate=false

# 应用版本号**唯一来源**（app 与 desktopApp 共读；versionCode 仍只在 app 的 defaultConfig）。
#
# 为什么收成一处：这三个消费者此前**各写一遍字面量** ——
#   app defaultConfig.versionName / app base.archivesName（APK 文件名）/ 桌面 packageVersion。
# 后果实测踩到过：`versionName` 升到 0.3.0 而 `archivesName` 还在 0.2.2，
# 于是「包内容是新号、文件名是旧号」的半吊子状态，而**没有任何测试或报错会响**。
# 与 LAYOUT_VERSION 是同一类人类记账（见 beca4fa：那个已改为引擎源码指纹自动导出）。
# 升版时只改这一行。
orilumn.versionName=0.4.4